<style>
/* Layout: one-screen game. Playfield (portrait canvas, aspect-fit) on top, weapon rack underneath.
   Deliberately single-theme: a night-sky playfield, weapons colour-coded (cyan / amber / magenta / coral). */
:root {
  color-scheme: dark;
  --bg: #080a18;
  --panel: #10142b;
  --line: #262c52;
  --fg: #e6e9f7;
  --muted: #8c93b8;
  --cyan: #5fe3ff;
  --amber: #ffb44a;
  --magenta: #ff5fb0;
  --coral: #ff7a59;
  --lime: #9dff8a;
  --display: 'Unbounded', system-ui, sans-serif;
  --body: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
html, body { height: 100%; }
body {
  box-sizing: border-box;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  padding-inline: 16px;
  padding-block: 12px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
.app { height: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
#stage { flex: 1; min-height: 0; position: relative; }
#frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); touch-action: none; }
#cv { width: 100%; height: 100%; display: block; border: 1px solid var(--line); border-radius: 6px; background: #050612; touch-action: none; }

.ov { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(6, 8, 22, 0.8); overflow-y: auto; border-radius: 6px; }
.card { width: 100%; max-width: 420px; display: grid; gap: 14px; margin-block: auto; }
.title { margin: 0; font: 700 clamp(22px, 6vw, 30px) / 1.1 var(--display); text-wrap: balance; }
.lead { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 13px; line-height: 1.35; }
.legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; align-items: start; }
.dot { width: 10px; height: 10px; margin-top: 4px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.legend b { font-weight: 600; }
.legend span.d { color: var(--muted); }
.controls { margin: 0; font: 500 12px / 1.7 var(--mono); color: var(--muted); }
.controls b { color: var(--fg); font-weight: 500; }
.go { appearance: none; border: 0; border-radius: 6px; background: var(--cyan); color: #06101c; font: 700 14px var(--display); padding: 13px 20px; cursor: pointer; justify-self: start; }
.go:hover { background: #8aeeff; }
[hidden] { display: none !important; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.ghost { appearance: none; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: 600 13px var(--body); padding: 12px 16px; cursor: pointer; }
.ghost:hover { border-color: var(--muted); }
.card.wide { max-width: 560px; }
.dock { position: absolute; left: 50%; top: 15%; transform: translateX(-50%); width: min(92%, 360px); display: grid; gap: 8px; justify-items: center; text-align: center; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(8, 10, 24, 0.84); pointer-events: none; }
.dock button { pointer-events: auto; }
.dk-name { margin: 0; font: 700 15px var(--display); }
.dk-sub { margin: 0; font-size: 12px; line-height: 1.4; color: var(--muted); }
.dock .go, .dock .ghost { padding: 10px 16px; font-size: 13px; }
.dock .row { justify-content: center; }
.hg-head { position: sticky; top: -16px; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 8px; background: var(--bg); }
.hg-head .title { font-size: clamp(18px, 5vw, 24px); }
.cr { font: 500 14px var(--mono); color: var(--amber); white-space: nowrap; }
.sec { margin: 4px 0 0; font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.ships { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.ship { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); align-content: start; }
.ship.sel { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan); }
.ship.lock canvas { opacity: 0.4; }
.ship canvas { width: 56px; height: 72px; }
.ship h3 { margin: 0; font: 700 13px var(--display); }
.ship p { margin: 3px 0 7px; font-size: 12px; line-height: 1.35; color: var(--muted); }
.ship .buy { margin-top: 8px; }
.stat { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 6px; align-items: center; font: 500 10px var(--mono); color: var(--muted); line-height: 1.7; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--cyan); }
.buy { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; font: 600 12px var(--body); padding: 8px 11px; cursor: default; white-space: nowrap; }
.buy.can { border-color: var(--cyan); background: var(--cyan); color: #06101c; cursor: pointer; }
.ups { display: grid; gap: 6px; }
.up { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.up .ut { min-width: 0; }
.up b { font-size: 13px; font-weight: 600; }
.up .d { margin: 2px 0 0; font-size: 12px; line-height: 1.35; color: var(--muted); }
.pips { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: middle; }
.pips i { width: 8px; height: 8px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--c, var(--cyan)); }

.rack { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 8px; }
.wbtn { appearance: none; min-width: 0; display: grid; gap: 2px; justify-items: start; text-align: left; padding: 8px 8px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); cursor: pointer; font-family: var(--body); }
.wbtn .key { font: 500 11px var(--mono); color: var(--c); }
.wbtn .nm { font: 600 13px var(--body); }
.wbtn .ct { font: 500 11px var(--mono); color: var(--muted); }
.wbtn[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c), 0 0 18px -6px var(--c); }
.wbtn.low { opacity: 0.45; }
.tools { display: grid; gap: 8px; }
.tbtn { appearance: none; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); font: 500 11px var(--mono); padding: 0 10px; cursor: pointer; }
.tbtn.off { opacity: 0.5; text-decoration: line-through; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

@media (max-width: 420px) {
  .wbtn { padding: 7px 6px 6px; }
  .wbtn .nm { font-size: 12px; }
  .tbtn { padding: 0 7px; }
}

html { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
</style>
</head>
<body>


<div class="app">
  <div id="stage">
    <div id="frame">
      <canvas id="cv" aria-label="Игровое поле"></canvas>
      <div class="dock" id="dock" hidden>
        <p class="dk-name" id="dkName"></p>
        <p class="dk-sub" id="dkSub"></p>
        <div class="row">
          <button class="go" id="dockHangar" type="button">Ангар</button>
          <button class="ghost" id="dockGo" type="button">Взлёт</button>
        </div>
      </div>
      <div class="ov" id="ov">
        <div class="card" id="mainCard">
          <h1 class="title" id="ovTitle"></h1>
          <p class="lead" id="ovLead"></p>
          <div id="ovBody"></div>
          <div class="row">
            <button class="go" id="go" type="button">Старт</button>
            <button class="ghost" id="hangBtn" type="button">Ангар</button>
            <button class="ghost" id="installBtn" type="button">На главный экран</button>
          </div>
          <p class="controls" id="installHelp" hidden>Android (Chrome): меню ⋮ → «Установить приложение» или «Добавить на главный экран».<br>iPhone (Safari): кнопка «Поделиться» → «На экран „Домой“».<br>Открывайте игру по ссылке прямо в браузере, а не внутри чата или приложения Claude.</p>
        </div>
        <div class="card wide" id="hangarCard" hidden></div>
      </div>
    </div>
  </div>
  <div class="rack" role="toolbar" aria-label="Оружие">
    <button class="wbtn" data-i="0" style="--c:#5fe3ff" type="button" aria-pressed="true"><span class="key">1</span><span class="nm">Бластер</span><span class="ct">∞</span></button>
    <button class="wbtn" data-i="1" style="--c:#ffb44a" type="button" aria-pressed="false"><span class="key">2</span><span class="nm">Веер</span><span class="ct">12 эн.</span></button>
    <button class="wbtn" data-i="2" style="--c:#ff5fb0" type="button" aria-pressed="false"><span class="key">3</span><span class="nm">Лазер</span><span class="ct">30 эн./с</span></button>
    <button class="wbtn" data-i="3" style="--c:#ff7a59" type="button" aria-pressed="false"><span class="key">4</span><span class="nm">Ракеты</span><span class="ct">20 эн.</span></button>
    <div class="tools">
      <button class="tbtn" id="pauseBtn" type="button">Пауза</button>
      <button class="tbtn" id="soundBtn" type="button">Звук</button>
    </div>
  </div>
</div>

  // ---------- audio ----------
  var ac = null, muted = false;
  function audio() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
  }
  function tone(freq, dur, type, vol, slide) {

      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

    } catch (e) {}
  }

  // ---------- sizing ----------

    frame.style.width = cw + 'px';
    frame.style.height = ch + 'px';

  // ---------- weapons ----------

  // ---------- asteroids ----------
  function makeAst(type, x, y, r, vx, vy) {
    var hp, sc, n, jit;
    switch (type) {
      case 'rock': hp = Math.max(1, Math.ceil(r / 10)); sc = Math.round(r); break;
      case 'ice': hp = r > 20 ? 2 : 1; sc = 20; break;
      case 'iron': hp = Math.round(r / 3.2); sc = 60; break;
      case 'magma': hp = Math.ceil(r / 8); sc = 50; break;
      default: hp = r > 20 ? 3 : 2; sc = 40;
    }
    n = type === 'ice' ? 7 : (type === 'iron' ? 9 : (type === 'crystal' ? 6 : 11));
    jit = type === 'iron' ? 0.08 : (type === 'ice' ? 0.18 : (type === 'crystal' ? 0.12 : 0.24));
    var pts = [], craters = [], i;
    for (i = 0; i < n; i++) pts.push({ a: i / n * Math.PI * 2, d: 1 - Math.random() * jit });
    for (i = 0; i < 3; i++) craters.push({ ox: rnd(-0.5, 0.5) * r, oy: rnd(-0.5, 0.5) * r, cr: rnd(0.14, 0.26) * r });
    return {
      type: type, x: x, y: y, r: r, vx: vx, vy: vy, hp: hp, maxHp: hp, score: sc,
      rot: rnd(0, 6.28), vr: rnd(-1, 1) * (type === 'iron' ? 0.6 : 1.4),
      pts: pts, craters: craters, flash: 0, t: rnd(0, 6), dead: false
    };
  }

  function pickType(lvl) {
    var w = [['rock', 10], ['ice', 4], ['crystal', 1.6]];
    if (lvl >= 2) w.push(['iron', 4]);
    if (lvl >= 3) w.push(['magma', 3]);
    var sum = 0, i;
    for (i = 0; i < w.length; i++) sum += w[i][1];
    var roll = Math.random() * sum;
    for (i = 0; i < w.length; i++) { roll -= w[i][1]; if (roll <= 0) return w[i][0]; }
    return 'rock';
  }

  function spawnAst(type, lvl, slow) {
    type = type || pickType(lvl);
    var spd = 1 + Math.min(1.2, (lvl - 1) * 0.09), r, vy;
    switch (type) {
      case 'rock': r = rnd(18, 42); vy = rnd(70, 130); break;
      case 'ice': r = rnd(13, 25); vy = rnd(150, 230); break;
      case 'iron': r = rnd(26, 40); vy = rnd(55, 90); break;
      case 'magma': r = rnd(24, 36); vy = rnd(80, 120); break;
      default: r = rnd(16, 24); vy = rnd(90, 130);
    }
    vy *= spd * (slow ? 0.7 : 1);
    asts.push(makeAst(type, rnd(r, W - r), -r - 10, r, rnd(-35, 35), vy));
  }

  function nearestAst(x, y) {
    var bestA = null, bd = 1e9;
    for (var i = 0; i < asts.length; i++) {
      var a = asts[i];
      if (a.dead || a.y < 0) continue;
      var d = Math.hypot(a.x - x, a.y - y);
      if (d < bd) { bd = d; bestA = a; }
    }
    return bestA;
  }

  function damageAst(a, dmg, kind) {
    if (a.dead) return;
    var d = dmg;
    if (a.type === 'iron') {
      if (kind === 'b' || kind === 's') d *= 0.4;
      else if (kind === 'x') d *= 1.5;
    }
    if (a.type === 'ice' && kind === 'l') d *= 1.5;
    a.hp -= d;
    a.flash = 0.07;
    if (a.hp <= 0) destroyAst(a);
  }

  function destroyAst(a) {
    if (a.dead) return;
    a.dead = true; kills++; score += a.score;
    var pal = PAL[a.type];
    if (a.type === 'magma') {
      explode(a.x, a.y, 95, 5, true, pal);
    } else {
      rings.push({ x: a.x, y: a.y, life: 0.35, max: 0.35, r0: 4, r1: a.r * 1.5, c: pal[1] });
      burst(a.x, a.y, Math.round(a.r * 0.9), pal, a.r * 5, 0.7, 3);
      shake = Math.min(14, shake + a.r * 0.15);
      noise(0.12 + a.r / 200, 0.12, 700 + 1500 / (1 + a.r / 20));
    }
    if (a.type === 'rock' && a.r >= 26) {
      for (var s = -1; s <= 1; s += 2) {
        asts.push(makeAst('rock', a.x + s * a.r * 0.35, a.y, a.r * 0.6, a.vx + s * rnd(40, 90), a.vy * rnd(0.9, 1.25)));

  function explode(x, y, radius, dmg, hurtPlayer, pal) {

  function collect(p) {

  // ---------- firing ----------
  function doFire(dt) {
    var w = WEAPONS[weapon], want = keys.fire || pointer.active;
    ship.cd -= dt;
    beam = false;
    if (want && w.id === 'laser' && energy > 1) {
      beam = true;
      energy = Math.max(0, energy - w.drain * stat.drain * dt);
      beamTick -= dt;
      while (beamTick <= 0) { beamTick += 0.06; beamHit(); }
      beamSnd -= dt;
      if (beamSnd <= 0) { beamSnd = 0.2; tone(150, 0.22, 'sawtooth', 0.025, 1.3); }
    } else {

      if (!want || ship.cd > 0) return;
      var id = w.id;
      if (id === 'laser') id = 'blaster';
      if (id !== 'blaster' && energy < WEAPONS[weapon].cost * stat.costMul) id = 'blaster';
      if (id === 'blaster') {
        ship.cd = 0.15 * stat.cd;
        var bn = stat.blasterN, bsp = bn === 2 ? 14 : (bn === 3 ? 10 : 9);
        for (var bi = 0; bi < bn; bi++) {
          bullets.push({ x: ship.x + (bi - (bn - 1) / 2) * bsp, y: ship.y - 22, vx: 0, vy: -760, dmg: stat.blasterDmg * stat.dmg, kind: 'b', r: 3, c: '#5fe3ff', life: 2 });
        }
        tone(880, 0.07, 'square', 0.025, 0.5);
      } else if (id === 'spread') {
        ship.cd = 0.4 * stat.cd; energy -= 12 * stat.costMul;

        }

      } else if (id === 'missile') {

  function beamHit() {

    }
    for (var i = 0; i < asts.length; i++) {
      var a = asts[i];
      if (a.dead) continue;
      if (a.y - a.r < ship.y - 10 && a.y + a.r > 0 && Math.abs(a.x - ship.x) < a.r + 4 * stat.laserW) {
        damageAst(a, stat.laserDmg * stat.dmg, 'l');

  }

  // ---------- update ----------
  function updateStars(dt) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += s.s * dt;
      if (s.y > H) { s.y -= H; s.x = rnd(0, W); }
    }
  }

  function updateAsts(dt) {
    for (var i = 0; i < asts.length; i++) {
      var a = asts[i];
      a.t += dt;
      a.x += (a.vx + (a.type === 'crystal' ? Math.cos(a.t * 2.6) * 95 : 0)) * dt;
      a.y += a.vy * dt;
      a.rot += a.vr * dt;
      if (a.flash > 0) a.flash = Math.max(0, a.flash - dt);
    }
    asts = asts.filter(function (a) { return !a.dead && a.y < H + 90 && a.x > -90 && a.x < W + 90; });
  }

  function updateFx(dt) {
    var i;
    for (i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 1 - Math.min(1, 1.6 * dt); p.vy *= 1 - Math.min(1, 1.6 * dt);
      p.life -= dt;
    }
    parts = parts.filter(function (p) { return p.life > 0; });
    for (i = 0; i < rings.length; i++) rings[i].life -= dt;
    rings = rings.filter(function (r) { return r.life > 0; });
    for (i = 0; i < dust.length; i++) {
      var du = dust[i];
      du.x += du.vx * dt; du.y += du.vy * dt;
      du.vx *= 1 - Math.min(1, 1.8 * dt); du.vy *= 1 - Math.min(1, 1.2 * dt);
      du.life -= dt;
    }
    dust = dust.filter(function (q) { return q.life > 0; });
    for (i = 0; i < texts.length; i++) { texts[i].t -= dt; texts[i].y -= 24 * dt; }
    texts = texts.filter(function (t) { return t.t > 0; });
  }

  function updateBullets(dt) {
    var i, j;
    for (i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      if (b.dead) continue;
      b.life -= dt;
      if (b.kind === 'm') {
        if (!b.target || b.target.dead) b.target = nearestTarget(b.x, b.y);
        var sp = Math.min(470, Math.hypot(b.vx, b.vy) + 520 * dt), cur = Math.atan2(b.vy, b.vx);
        if (b.target) {
          var d = Math.atan2(b.target.y - b.y, b.target.x - b.x) - cur;
          while (d > Math.PI) d -= 2 * Math.PI;
          while (d < -Math.PI) d += 2 * Math.PI;
          cur += clamp(d, -4.5 * dt, 4.5 * dt);
        }
        b.vx = Math.cos(cur) * sp; b.vy = Math.sin(cur) * sp;
        if (Math.random() < 0.9) parts.push({ x: b.x - b.vx * 0.02, y: b.y - b.vy * 0.02, vx: rnd(-20, 20), vy: rnd(-20, 20), life: 0.35, max: 0.35, size: 2.4, c: Math.random() < 0.5 ? '#ffb44a' : '#ff7a59' });
      }
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.life <= 0) {
        b.dead = true;
        if (b.kind === 'm') explode(b.x, b.y, stat.missR, 5 * stat.dmg, false, PAL.magma);
        continue;
      }
      if (b.y < -30 || b.x < -30 || b.x > W + 30) { b.dead = true; continue; }
      if (boss && !boss.dying && Math.hypot(boss.x - b.x, boss.y - b.y) < boss.r * 0.9 + b.r) {
        b.dead = true;
        if (b.kind === 'm') explode(b.x, b.y, stat.missR, 5 * stat.dmg, false, PAL.magma);
        else { damageBoss(b.dmg, b.kind); burst(b.x, b.y, 3, [b.c, '#ffffff'], 110, 0.25, 2); }
        continue;
      }
      for (j = 0; j < asts.length; j++) {
        var a = asts[j];
        if (a.dead || a.y < -a.r) continue;
        if (Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r) {
          b.dead = true;
          if (b.kind === 'm') {
            explode(b.x, b.y, stat.missR, 5 * stat.dmg, false, PAL.magma);
          } else {
            damageAst(a, b.dmg, b.kind);
            burst(b.x, b.y, 3, [b.c, '#ffffff'], 110, 0.25, 2);
          }

        }

  }

  function updatePicks(dt) {
    for (var i = 0; i < picks.length; i++) {
      var p = picks[i];

      var d = Math.hypot(ship.x - p.x, ship.y - p.y);
      if (d < 130 * stat.mag && d > 1) { p.x += (ship.x - p.x) / d * 160 * stat.mag * dt; p.y += (ship.y - p.y) / d * 160 * stat.mag * dt; }

    }
    picks = picks.filter(function (p) { return !p.dead && p.y < H + 30; });
  }

  function moveShip(dt) {
    var ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), ay = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);

    ship.y = clamp(ship.y, H * 0.4, H - 40);
  }

  function update(dt) {
    time += dt;
    if (phase === 'fight') {
      if (boss) updateBoss(dt);

    } else if (phase === 'approach') {
      var dy = 40 - planetY;
      if (Math.abs(dy) > 0.5) {

      } else {

        land0 = { x: ship.x, y: ship.y };

    } else if (phase === 'leave') {

    }

    shield = Math.max(0, shield - dt);
    shake = Math.max(0, shake - 40 * dt);

    if (phase === 'fight' || phase === 'approach') { moveShip(dt); doFire(dt); }
    else { beam = false; }

    spawnT -= dt;
    if (phase === 'fight' && spawnT <= 0 && asts.length < 32) {
      spawnAst(null, wave);
      if (wave >= 3 && Math.random() < 0.35) spawnAst(null, wave);
      spawnT = Math.max(0.4, 1.05 - wave * 0.06) * rnd(0.7, 1.2) * (boss ? 2.8 : 1);
    }

    updateStars(dt);
    updateBullets(dt);
    updateEBullets(dt);
    updateAsts(dt);

    if (state === 'play') {
      for (var i = 0; i < asts.length; i++) {
        var a = asts[i];
        if (a.dead) continue;
        if (Math.hypot(a.x - ship.x, a.y - ship.y) < a.r * 0.85 + ship.r * 0.8) {
          destroyAst(a);
          hitPlayer();
          if (state !== 'play') break;
        }
      }
    }
    if (boss && !boss.dying && state === 'play' && phase === 'fight') {
      if (Math.hypot(boss.x - ship.x, boss.y - ship.y) < boss.r * 0.8 + ship.r * 0.8) {
        hitPlayer();
        ship.y = Math.min(H - 40, ship.y + 260 * dt);
      }
    }
    if (state === 'play') updatePicks(dt);
    updateFx(dt);
    if (best < score) best = score;
    gainCredits();
    persistT -= dt;

  }

  function idle(dt) {
    updateStars(dt);
    idleT -= dt;
    if (idleT <= 0 && asts.length < 14) { spawnAst(null, 4, true); idleT = 0.7; }
    updateAsts(dt);
    updateFx(dt);
  }

  // ---------- drawing ----------
  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0d0b26'); g.addColorStop(1, '#070916');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var n1 = ctx.createRadialGradient(W * 0.2, H * 0.28, 0, W * 0.2, H * 0.28, 320);
    n1.addColorStop(0, 'rgba(120,60,200,0.16)'); n1.addColorStop(1, 'rgba(120,60,200,0)');
    ctx.fillStyle = n1; ctx.fillRect(0, 0, W, H);
    var n2 = ctx.createRadialGradient(W * 0.85, H * 0.7, 0, W * 0.85, H * 0.7, 300);
    n2.addColorStop(0, 'rgba(40,140,200,0.12)'); n2.addColorStop(1, 'rgba(40,140,200,0)');
    ctx.fillStyle = n2; ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = s.a * (1 - atmo * 0.92);
      ctx.fillStyle = '#dfe6ff';
      ctx.fillRect(s.x, s.y, s.z, s.z);
    }
    ctx.globalAlpha = 1;
  }

  function polyPath(a, scale) {
    ctx.beginPath();
    for (var i = 0; i < a.pts.length; i++) {
      var p = a.pts[i], x = Math.cos(p.a) * a.r * p.d * scale, y = Math.sin(p.a) * a.r * p.d * scale;

    }
    ctx.closePath();
  }

  function drawAst(a) {

    ctx.translate(a.x, a.y);

      var col = a.type === 'magma' ? '255,120,40' : '230,110,255';
      g = ctx.createRadialGradient(0, 0, r * 0.6, 0, 0, r * 1.9);
      g.addColorStop(0, 'rgba(' + col + ',' + (a.type === 'magma' ? 0.4 + 0.1 * Math.sin(a.t * 5) : 0.28) + ')');

    }

      case 'ice': c1 = '#d9f6ff'; c2 = '#5fb4d8'; st = '#effcff'; break;
      case 'iron': c1 = '#8794ab'; c2 = '#2f3646'; st = '#c3cde0'; break;
      case 'magma': c1 = '#5a2316'; c2 = '#1d0b08'; st = '#ff8a3d'; break;
      default: c1 = '#f08cff'; c2 = '#6a2aa8'; st = '#ffd0ff';
    }
    g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r * 1.1);
    g.addColorStop(0, c1); g.addColorStop(1, c2);

    ctx.lineWidth = 1.5; ctx.strokeStyle = st; ctx.stroke();

    if (a.type === 'rock') {
      for (i = 0; i < a.craters.length; i++) {
        var cr = a.craters[i];
        ctx.fillStyle = 'rgba(0,0,0,0.26)'; ctx.beginPath(); ctx.arc(cr.ox, cr.oy, cr.cr, 0, 6.283); ctx.fill();
        ctx.strokeStyle = 'rgba(255,240,220,0.18)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cr.ox, cr.oy, cr.cr, 0.4, 2.6); ctx.stroke();
      }

      for (i = 0; i < a.pts.length; i += (a.type === 'ice' ? 2 : 1)) {

      }
      ctx.fillStyle = 'rgba(255,255,255,0.5)';

    } else if (a.type === 'iron') {
      ctx.fillStyle = 'rgba(210,220,240,0.7)';

        ctx.beginPath(); ctx.arc(Math.cos(i * 1.047) * r * 0.62, Math.sin(i * 1.047) * r * 0.62, Math.max(1.4, r * 0.05), 0, 6.283); ctx.fill();

    ctx.restore();

      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(a.x - bw / 2, a.y + r + 6, bw, 4);

  var PLANETS = [
    { name: 'Эрида', type: 'rock', c: ['#e8c08a', '#b5703a', '#4a2a1a'], ring: true },
    { name: 'Каллисто', type: 'rock', c: ['#b7b0a6', '#6d655d', '#2c2824'] },
    { name: 'Тритон', type: 'ice', c: ['#e3fbff', '#8ccfe6', '#2f6a8a'] },
    { name: 'Хирон', type: 'lava', c: ['#ffb070', '#c2452a', '#3a0f0a'] },
    { name: 'Нерида', type: 'ocean', c: ['#bfe3ff', '#4f7fd1', '#1b2a66'] },
    { name: 'Оберон', type: 'rock', c: ['#c9e8b0', '#5d9a5a', '#1d3d2c'] }
  ];

  function rgba(hex, a) {
    var n = parseInt(hex.slice(1), 16);

  }
  function smooth(v) { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function makePlanet(n) {
    var def = PLANETS[(n - 1) % PLANETS.length], i;
    var p = { name: def.name, type: def.type, c: def.c, ring: !!def.ring, R: 235, cx: n % 2 ? W * 0.62 : W * 0.38, tilt: rnd(-0.3, 0.3), bands: [], craters: [], cracks: [], rocks: [], mtF: [], mtN: [] };
    for (i = 0; i < 16; i++) p.bands.push({ y: rnd(-0.95, 0.95), h: rnd(0.04, 0.15), a: rnd(0.12, 0.38), dark: Math.random() < 0.55 });
    for (i = 0; i < 16; i++) {
      var ca = rnd(0, 6.283), cd = Math.sqrt(Math.random()) * 0.85;
      p.craters.push({ x: Math.cos(ca) * cd, y: Math.sin(ca) * cd, r: rnd(0.04, 0.12) });
    }
    for (i = 0; i < 9; i++) {

      p.cracks.push([x0, y0, x0 + rnd(-0.3, 0.3), y0 + rnd(-0.3, 0.3), x0 + rnd(-0.5, 0.5), y0 + rnd(-0.5, 0.5)]);
    }

  }

  // zoom 0..1: 0 = small planet at the top, 1 = standing on the surface
  function planetT() {

    return 0;
  }
  function planetGeom() {

  }

  function drawRing(p, g0, back) {

  }

  function drawPlanet() {
    var p = planet, g0 = planetGeom(), x = g0.x, y = g0.y, R = g0.R, t = g0.t, top = g0.top, c = ctx, g, i;
    if (atmo > 0 && top > 0) {
      g = c.createLinearGradient(0, 0, 0, top + 4);
      g.addColorStop(0, 'rgba(5,6,20,0)');
      g.addColorStop(0.6, rgba(p.c[2], 0.4 * atmo));
      g.addColorStop(1, rgba(p.c[0], 0.8 * atmo));

    c.save();
    c.beginPath(); c.arc(x, y, R, 0, 6.283); c.clip();
    g = c.createRadialGradient(x - R * 0.4, y - R * 0.35, R * 0.1, x, y, R * 1.05);
    g.addColorStop(0, p.c[0]); g.addColorStop(0.55, p.c[1]); g.addColorStop(1, p.c[2]);
    c.fillStyle = g; c.fillRect(x - R, y - R, R * 2, R * 2);
    if (p.type === 'ocean') {
      for (i = 0; i < p.bands.length; i++) {
        var b = p.bands[i];
        c.fillStyle = rgba(b.dark ? p.c[2] : '#ffffff', b.a * 0.8);
        c.fillRect(x - R, y + b.y * R, R * 2, b.h * R);
      }
    } else {
      for (i = 0; i < p.craters.length; i++) {

    ctx.lineCap = 'round';
    for (i = 0; i < bullets.length; i++) {
      b = bullets[i];
      if (b.kind === 'm') {
        var ang = Math.atan2(b.vy, b.vx);
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ang);
        ctx.fillStyle = '#f4f6ff'; ctx.fillRect(-9, -3, 14, 6);
        ctx.fillStyle = '#ff7a59'; ctx.beginPath(); ctx.moveTo(5, -3); ctx.lineTo(11, 0); ctx.lineTo(5, 3); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#d4503f'; ctx.fillRect(-9, -5, 4, 10);
        ctx.restore();
      } else {
        var len = b.kind === 'b' ? 0.026 : 0.018;
        ctx.strokeStyle = b.c; ctx.globalAlpha = 0.35; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * len, b.y - b.vy * len); ctx.stroke();
        ctx.globalAlpha = 1; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * len, b.y - b.vy * len); ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * len * 0.5, b.y - b.vy * len * 0.5); ctx.stroke();
      }
    }
  }

  function drawBeam() {
    var w = (10 + Math.sin(time * 60) * 2) * stat.laserW, top = 0, bot = ship.y - 24;
    if (boss && !boss.dying && Math.abs(boss.x - ship.x) < boss.r * 0.9) top = Math.max(0, boss.y + boss.r * 0.8);
    var g = ctx.createLinearGradient(ship.x - w, 0, ship.x + w, 0);
    g.addColorStop(0, 'rgba(255,95,176,0)'); g.addColorStop(0.5, 'rgba(255,95,176,0.55)'); g.addColorStop(1, 'rgba(255,95,176,0)');
    ctx.fillStyle = g; ctx.fillRect(ship.x - w, top, w * 2, bot - top);
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(ship.x - 1.6, top, 3.2, bot - top);
    ctx.fillStyle = 'rgba(255,200,235,0.8)';
    ctx.beginPath(); ctx.arc(ship.x, bot, 9, 0, 6.283); ctx.fill();
  }

  function drawPick(p) {
    var c = p.kind === 'energy' ? '#5fe3ff' : (p.kind === 'shield' ? '#9dff8a' : '#ff7a59');
    var g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 22);
    g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.45 + 0.15 * Math.sin(p.t * 6); ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#0a0d22'; ctx.strokeStyle = c; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle = c; ctx.strokeStyle = c;
    if (p.kind === 'energy') {
      ctx.beginPath(); ctx.moveTo(p.x + 2, p.y - 7); ctx.lineTo(p.x - 4, p.y + 1); ctx.lineTo(p.x, p.y + 1); ctx.lineTo(p.x - 2, p.y + 7); ctx.lineTo(p.x + 4, p.y - 1); ctx.lineTo(p.x, p.y - 1); ctx.closePath(); ctx.fill();
    } else if (p.kind === 'shield') {
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 6.283); ctx.stroke();
    } else {
      ctx.fillRect(p.x - 1.6, p.y - 6, 3.2, 12); ctx.fillRect(p.x - 6, p.y - 1.6, 12, 3.2);
    }
  }

  function drawHUD() {
    var i;
    ctx.save();
    if (planet) {
      var sg = ctx.createLinearGradient(0, 0, 0, 125);
      sg.addColorStop(0, 'rgba(5,6,20,0.75)'); sg.addColorStop(1, 'rgba(5,6,20,0)');
      ctx.fillStyle = sg; ctx.fillRect(0, 0, W, 125);
    }
    ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    ctx.fillStyle = '#8c93b8'; ctx.font = '500 11px "IBM Plex Mono", monospace';
    ctx.fillText('ОЧКИ', 16, 14);
    ctx.fillStyle = '#e6e9f7'; ctx.font = '500 24px "IBM Plex Mono", monospace';
    ctx.fillText(String(score).padStart(6, '0'), 16, 28);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#8c93b8'; ctx.font = '500 11px "IBM Plex Mono", monospace';
    ctx.fillText('ВОЛНА', W / 2, 14);
    ctx.fillStyle = '#e6e9f7'; ctx.font = '500 24px "IBM Plex Mono", monospace';
    ctx.fillText(String(wave), W / 2, 28);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#8c93b8'; ctx.font = '500 11px "IBM Plex Mono", monospace';
    ctx.fillText('РЕКОРД ' + String(best).padStart(6, '0'), W - 16, 46);
    ctx.fillStyle = '#ffb44a'; ctx.fillText('КРЕДИТЫ ' + save.credits, W - 16, 60);
    if (boss) {
      ctx.textAlign = 'left'; ctx.fillStyle = '#ff7a59'; ctx.font = '500 11px "IBM Plex Mono", monospace';
      ctx.fillText(boss.name.toUpperCase(), 210, 64);
      ctx.fillStyle = '#262c52'; ctx.fillRect(210, 80, 190, 8);
      ctx.fillStyle = boss.phase2 ? '#ff5a4a' : '#ff7a59';
      ctx.fillRect(210, 80, 190 * clamp(boss.hp / boss.maxHp, 0, 1), 8);
    }
    for (i = 0; i < lives; i++) drawRocket(W - 26 - i * 24, 24, 0.5, false);

    ctx.textAlign = 'left';
    ctx.fillStyle = '#8c93b8'; ctx.fillText('ЭНЕРГИЯ', 16, 64);
    ctx.fillStyle = '#262c52'; ctx.fillRect(16, 80, 180, 6);
    ctx.fillStyle = energy < 20 ? '#ff7a59' : '#5fe3ff';
    ctx.fillRect(16, 80, 180 * Math.min(1, energy / stat.energyMax), 6);
    if (shield > 0) {
      ctx.fillStyle = '#9dff8a'; ctx.fillText('ЩИТ', 16, 92);
      ctx.fillRect(16, 108, 180 * shield / 7, 4);
    }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.save();
    if (shake > 0.2) ctx.translate(rnd(-shake, shake) * 0.5, rnd(-shake, shake) * 0.5);
    atmo = planet ? clamp((planetT() - 0.25) / 0.6, 0, 1) : 0;
    drawBackground();
    if (planet) drawPlanet();
    drawDust();
    var i, playing = (state === 'play' || state === 'paused');

    for (i = 0; i < picks.length; i++) drawPick(picks[i]);
    for (i = 0; i < asts.length; i++) drawAst(asts[i]);
    if (boss) drawBoss();

    ctx.globalCompositeOperation = 'lighter';
    if (beam && state === 'play') drawBeam();
    drawBullets();
    drawEBullets();
    ctx.globalCompositeOperation = 'source-over';
    drawBossBeams();

    if (playing) {
      if (!(invuln > 0 && Math.floor(invuln * 12) % 2 === 0)) {
        if (legD > 0) drawLegs(ship.x, ship.y, legD);
        drawRocket(ship.x, ship.y, 1, phase !== 'dock');
      }
      if (shield > 0) {
        var pulse = shield < 1.5 ? (Math.floor(shield * 8) % 2 ? 0.3 : 0.8) : 0.8;
        ctx.strokeStyle = 'rgba(157,255,138,' + pulse + ')'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(ship.x, ship.y, ship.r + 17, 0, 6.283); ctx.stroke();
        ctx.fillStyle = 'rgba(157,255,138,0.08)'; ctx.fill();
      }
    }

    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < parts.length; i++) {
      var p = parts[i], al = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = al; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + al * 0.6), 0, 6.283); ctx.fill();
    }
    for (i = 0; i < rings.length; i++) {
      var rg = rings[i], t = 1 - rg.life / rg.max, e = 1 - (1 - t) * (1 - t);
      ctx.globalAlpha = (1 - t) * 0.8; ctx.strokeStyle = rg.c; ctx.lineWidth = 3 * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r0 + (rg.r1 - rg.r0) * e, 0, 6.283); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    if (state !== 'menu') drawHUD();

    ctx.save();
    ctx.textAlign = 'center';
    for (i = 0; i < texts.length; i++) {
      ctx.globalAlpha = clamp(texts[i].t / 0.5, 0, 1);
      ctx.fillStyle = texts[i].c; ctx.font = '500 12px "IBM Plex Mono", monospace';
      ctx.fillText(texts[i].text, texts[i].x, texts[i].y);
    }
    if (banner && state === 'play') {
      ctx.globalAlpha = clamp(banner.t / 0.6, 0, 1) * clamp((2.4 - banner.t) / 0.3, 0, 1);
      ctx.fillStyle = '#e6e9f7'; ctx.font = '700 30px Unbounded, sans-serif';
      ctx.fillText(banner.text.toUpperCase(), W / 2, H * 0.3);
      ctx.fillStyle = '#8c93b8'; ctx.font = '400 14px "IBM Plex Sans", sans-serif';
      ctx.fillText(banner.sub, W / 2, H * 0.3 + 42);
      if (banner.sub2) { ctx.font = '400 12px "IBM Plex Sans", sans-serif'; ctx.fillText(banner.sub2, W / 2, H * 0.3 + 64); }
    }
    ctx.restore();

    // weapon rack low-energy hint
    for (i = 0; i < wbtns.length; i++) {
      var low = WEAPONS[i].cost > 0 && energy < WEAPONS[i].cost * stat.costMul;
      if (wbtns[i].classList.contains('low') !== low) wbtns[i].classList.toggle('low', low);
    }
  }

  // ---------- overlay & flow ----------
  var LEGEND =
    '<ul class="legend">' +
    '<li style="--c:#9a8b7d"><span class="dot"></span><span><b>Камень</b> <span class="d">раскалывается на осколки</span></span></li>' +
    '<li style="--c:#8fdcff"><span class="dot"></span><span><b>Лёд</b> <span class="d">быстрый и хрупкий, лазер плавит его вдвое быстрее</span></span></li>' +
    '<li style="--c:#aab4c8"><span class="dot"></span><span><b>Железо</b> <span class="d">броня гасит бластер и веер, берите ракеты или лазер</span></span></li>' +
    '<li style="--c:#ff7a3d"><span class="dot"></span><span><b>Магма</b> <span class="d">взрывается и ранит соседей, держите дистанцию</span></span></li>' +
    '<li style="--c:#f08cff"><span class="dot"></span><span><b>Кристалл</b> <span class="d">идёт зигзагом, роняет бонусы</span></span></li>' +
    '</ul>';
  var CONTROLS =
    '<p class="controls"><b>Стрелки / WASD</b> движение · <b>Пробел</b> огонь · <b>1–4</b> или <b>Q/E</b> оружие · <b>P</b> пауза · на планете <b>H</b> ангар, <b>T</b> взлёт<br>' +
    'Телефон: ведите пальцем, ракета следует за ним и стреляет. Оружие выбирайте кнопками внизу.</p>';

  function shipLine() {
    return '<p class="controls">Корабль: <b>' + SHIPS[save.ship].name + '</b> · Кредиты: <b>' + save.credits + '</b></p>';
  }

  function showOverlay(kind) {
    ovKind = kind;
    mainCard.hidden = false; hangarCard.hidden = true;
    hangBtn.hidden = (kind === 'paused');
    installBtn.hidden = (kind === 'paused') || isInstalled;
    installHelp.hidden = true;
    if (kind === 'menu') {
      ovTitle.textContent = 'Астероидный рубеж';
      ovLead.textContent = 'Расстреливайте астероиды, пока они не добрались до корпуса. Кредиты капают за каждый сбитый астероид. После каждой волны (25 секунд) вы совершаете посадку на планету: там можно открыть ангар прямо во время вылета, купить корабль или улучшение и взлететь снова. Каждые 10 волн вас ждёт босс.';
      ovBody.innerHTML = '<div style="display:grid;gap:14px">' + shipLine() + LEGEND + CONTROLS + '</div>';
      goBtn.textContent = 'Старт';
    } else if (kind === 'paused') {
      ovTitle.textContent = 'Пауза';
      ovLead.textContent = 'Игра остановлена.';
      ovBody.innerHTML = CONTROLS;
      goBtn.textContent = 'Продолжить';
    } else {
      ovTitle.textContent = 'Корпус разрушен';
      ovLead.textContent = 'Счёт ' + score + ', волна ' + wave + ', уничтожено астероидов: ' + kills + '. ' + (score >= best && score > 0 ? 'Новый рекорд!' : 'Рекорд ' + best + '.') + ' Заработано: +' + lastEarned + ' кр.';
      ovBody.innerHTML = shipLine();
      goBtn.textContent = 'Играть снова';
    }
    ov.hidden = false;
    try { goBtn.focus({ preventScroll: true }); } catch (e) {}
  }

  function startGame() {
    audio();
    stat = computeStats();
    updateRackLabels();
    ship = { x: W / 2, y: H - 120, r: stat.hitR, cd: 0 };
    bullets = []; asts = []; parts = []; rings = []; picks = []; texts = [];
    score = 0; lives = stat.maxLives; energy = stat.energyMax; time = 0; wave = 1; spawnT = 0.8; shake = 0;
    invuln = 1.2; shield = 0; beam = false; beamTick = 0; kills = 0;
    banner = { t: 2.4, text: 'Волна 1', sub: 'Камни, лёд и кристаллы' };
    phase = 'fight'; waveT = 0; leaveT = 0; planet = null; docked = false; dock.hidden = true;
    inGameHangar = false; runEarned = 0; credPaid = 0; persistT = 5;
    dust = []; ebullets = []; boss = null; bossBonus = 0; legD = 0; atmo = 0; landZ = 0; leaveZ = 0;
    setWeapon(0);
    state = 'play';
    ov.hidden = true;
  }

  function gameOver() {
    state = 'over';
    pointer.active = false; keys.fire = false; beam = false;
    burst(ship.x, ship.y, 50, ['#ffffff', '#ffb44a', '#ff7a59', '#d4503f'], 320, 1.1, 3.4);
    rings.push({ x: ship.x, y: ship.y, life: 0.7, max: 0.7, r0: 8, r1: 130, c: '#ffb44a' });
    if (score > best) best = score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    gainCredits();
    lastEarned = runEarned;
    persist();
    planet = null; dock.hidden = true; phase = 'fight';
    boss = null; ebullets = []; legD = 0;
    showOverlay('over');
  }

  function pauseGame() {
    if (inGameHangar) return;
    if (state === 'play') { state = 'paused'; pointer.active = false; keys.fire = false; showOverlay('paused'); }
  }
  function resumeGame() {
    if (state === 'paused') { state = 'play'; ov.hidden = true; }
  }

  goBtn.addEventListener('click', function () {
    audio();
    if (state === 'paused') resumeGame(); else startGame();
  });
  pauseBtn.addEventListener('click', function () {
    if (state === 'play') pauseGame(); else if (state === 'paused') resumeGame();
    pauseBtn.blur();
  });
  soundBtn.addEventListener('click', function () {
    audio(); muted = !muted;
    soundBtn.classList.toggle('off', muted);
    soundBtn.blur();
  });

  // ---------- input ----------
  var KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'fire'
  };
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var m = KEYMAP[e.code];
    if (inGameHangar) {
      if (e.code === 'Escape' || e.code === 'KeyH') closeHangar();
      return;
    }
    if (e.code === 'KeyH' && state === 'play') { openGameHangar(); return; }
    if (e.code === 'KeyT' && state === 'play') { takeoff(); return; }
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (state === 'play') pauseGame(); else if (state === 'paused') resumeGame();
      return;
    }
    if (e.code === 'KeyM') { soundBtn.click(); return; }
    if (state !== 'play') return;
    if (m) { keys[m] = true; e.preventDefault(); return; }
    if (e.code === 'Digit1' || e.code === 'Numpad1') setWeapon(0);
    else if (e.code === 'Digit2' || e.code === 'Numpad2') setWeapon(1);
    else if (e.code === 'Digit3' || e.code === 'Numpad3') setWeapon(2);
    else if (e.code === 'Digit4' || e.code === 'Numpad4') setWeapon(3);
    else if (e.code === 'KeyQ') setWeapon(weapon - 1);
    else if (e.code === 'KeyE') setWeapon(weapon + 1);
  });
  window.addEventListener('keyup', function (e) {
    var m = KEYMAP[e.code];
    if (m) keys[m] = false;
  });
  window.addEventListener('blur', function () { keys = {}; pointer.active = false; pauseGame(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { keys = {}; pauseGame(); } });

  function setPointer(e) {
    var r = canvas.getBoundingClientRect();
    pointer.x = (e.clientX - r.left) / r.width * W;
    pointer.y = (e.clientY - r.top) / r.height * H;
    pointer.touch = e.pointerType === 'touch' || e.pointerType === 'pen';
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (state !== 'play') return;
    audio();
    setPointer(e);
    pointer.active = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) { if (pointer.active) setPointer(e); });
  function endPointer() { pointer.active = false; }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---------- loop ----------
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
    last = now;
    if (state === 'play') update(dt);
    else if (state === 'menu' || state === 'over') idle(dt);
    draw();
    requestAnimationFrame(loop);
  }

  updateRackLabels();
  showOverlay('menu');
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
